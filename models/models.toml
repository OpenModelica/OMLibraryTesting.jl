[meta]
msl_version = "MSL:3.2.3"
description = "OM.jl MSL coverage model registry"
reference_source = "MAP-LIB_ReferenceResults (Dymola, branch v3.2.3)"

# ==========================================================================
# Per-model fields supported (in addition to expected, skipPhases, issue, ...):
#   solver         = "Rodas5" | "Rodas5P" | "QNDF" | "FBDF" | "TRBDF2"
#                  | "RadauIIA5" | "IDA"          (default = MTK auto-pick)
#   dtmax          = <float>                       (0.0 = no upper bound)
#   initializealg  = "BrownFullBasicInit" | "ShampineCollocationInit"
#                  | "OverrideInit" | "CheckInit" | "NoInit" | "BrownBasicInit"
#                                                  (default = solver default)
#   solverReltol   = <float>                       (0.0 = SciML default ~1e-3)
#   solverAtol     = <float>                       (0.0 = SciML default ~1e-6)
#                  Note: distinct from atol/reltol above which are validation
#                  tolerances for trajectory comparison. Use solverReltol /
#                  solverAtol to loosen the integrator (e.g. near-singular
#                  Jacobians that force dt below eps under default tolerances).
#
# Use cases for initializealg:
#   - DAE with rank-deficient algebraic Jacobian at t=0 (e.g. flow-state
#     models with all flows = 0 initially): try ShampineCollocationInit
#     which can modify all variables to find a consistent IC, not just
#     the algebraic ones.
#   - Index-1 DAE with inconsistent algebraic IC: BrownFullBasicInit.
#   - Skip initialization entirely (assumes u0 already consistent): NoInit.
#   - Verify only without modifying: CheckInit.
#
# ==========================================================================
# Domain-level overrides: apply skipPhases/expected to all models in a domain
# ==========================================================================

[domain_overrides."Electrical.PowerConverters"]
skipPhases = ["validate"]
issue = "MatchFailure: unfinished match for type SOME{VariableAttributes}"

[domain_overrides."Thermal.FluidHeatFlow"]
skipPhases = ["simulate", "validate"]
issue = "FluidHeatFlow split into 4 buckets after live probing (2026-05-09): (a) SimpleCooling/OneMass/PumpDropOut/TwoTanks simulate cleanly with default Rodas5 (CombiTimeTable runtime is in place; original Apr-22 wiring claim was outdated). SimpleCooling validates 2/2 signals (override removed). OneMass/PumpDropOut/TwoTanks fail validate due to inconsistent DAE initial conditions (IDA CheckInit confirms; not a solver issue, runtime start-value propagation gap). (b) TwoMass/WaterPump/IndirectCooling/PumpAndValve/ParallelCooling/ParallelPumpDropOut hit a singular 16x16 Jacobian after the ifCond counter fix in CodeGenerationUtil.jl:2529,2547 unblocked codegen. (c) TestOpenTank/TestCylinder fail with `combiTimeTable_startTime not defined` — DATA_STRUCTURE constructor references an unemitted Real parameter."

