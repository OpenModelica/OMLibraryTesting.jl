issue = "2026-05-16 cycle 6: SIM fast-fails with UndefVarError: `currentSensorQS_y` (bare Complex parent name) at MTK eval. Diagnosis: BDAE binding expressions like `Modelica_ComplexMath_'abs'(currentSensorQS_y)` reference the Complex parent CREF; siblings `_y_re` and `_y_im` are in HT but the parent CREF's type was downgraded from T_COMPLEX upstream so `flattenRecordCallArg` does not match (only fires on T_COMPLEX patterns). Adding the `_re`/`_im` HT-fallback to flattenRecordCallArg would emit a 2-arg Modelica_ComplexMath_abs call, but the Modelica function `'abs'` is declared as a 1-arg Complex signature — would regress with MethodError. Potentially tricky fix: companion arm in either the Modelica function codegen (accept scalarized form) or the BDAE binding-expression scalarizer (rewrite parent CREFs in binding RHS to `Complex(re, im)` literal records before codegen). Cluster E."
