[meta]
msl_version = "MSL:3.2.3"
description = "OM.jl MSL coverage model registry"
reference_source = "MAP-LIB_ReferenceResults (Dymola, branch v3.2.3)"

# ==========================================================================
# Domain-level overrides: apply skipPhases/expected to all models in a domain
# ==========================================================================

[domain_overrides."Electrical.PowerConverters"]
skipPhases = ["backend", "validate"]
issue = "MatchFailure: unfinished match for type SOME{VariableAttributes}"

[domain_overrides."Thermal.FluidHeatFlow"]
skipPhases = ["simulate", "validate"]
issue = "Backend now passes for all FluidHeatFlow models (2026-04-22 getNextTimeEvent DAE.CALL and DATA_STRUCTURE varKind fixes in OMBackend/CodeGeneration/codeGen.jl). Simulate still skipped because the external-object runtime for Modelica.Blocks.Tables.Internal.getNextTimeEvent / CombiTimeTable is not wired up — the emitted Julia function would be UndefVarError at runtime. Remove this override once external-obj dispatch for the tables runtime is added."

[domain_overrides."StateGraph"]
skipPhases = ["simulate", "validate"]
issue = "Backend now passes (2026-04-22 time-in-initial-equation fix in MTK_CodeGeneration.jl). Simulate still fails with ExtraVariablesSystemException: the generated system is unbalanced (more variables than equations), likely because the StateGraph discrete-state logic is not being fully resolved into constraints. Deferred."

