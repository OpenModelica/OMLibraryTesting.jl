# OM.jl MSL 4.1.0 coverage model registry: per-model overrides, as models/models.toml for 3.2.3.
# The model list comes from omc (models/experiments_Modelica_4.1.0.txt), the reference data from
# MAP-LIB_ReferenceResults v4.1.0 (reference/download_refs.sh --msl 4.1.0, into reference/4.1.0/).
#
# Seeded 2026-10-12 from models/models.toml: for the 4.1.0 models with a 3.2.3 entry of the same
# name, its solver and tolerance settings, inline reference and a stopTime shortened below the
# experiment's. Status marks (expected, skipPhases, issue) are left out: they describe 3.2.3 runs.
# The fields are documented in models/models.toml.
#
# 2026-10-27: the relaxed validation settings (atol/reltol above 0.01/3e-3, a stopTime short of the experiment's) are
# off the 113 relaxed entries of models that validated: 95 validate strictly, 18 do not (their issue notes the
# finding). A stopTime stays only where the reference ends before the experiment (ChuaCircuit, PointGravityWithPointMasses2).

[meta]
description = "OM.jl MSL 4.1.0 coverage model registry"
